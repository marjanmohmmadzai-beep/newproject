<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyPatientHUB - Login</title>

    <!-- Font Awesome برای آیکون‌ها -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- قسمت بالای صفحه -->
    <section class="login-background">

        <div class="welcome-text">
            <h1>Welcome to MyPatientHUB!</h1>
            <p>We provide smart healthcare services in your hands.</p>
        </div>

    </section>


    <!-- Login Box -->
    <div class="login-box">

        <h2>Sign in to MyPatientHUB</h2>


        <!-- Facebook & Google -->
        <div class="social-buttons">

            <button type="button">
                <i class="fa-brands fa-facebook-f"></i>
            </button>

            <button type="button">
                <i class="fa-brands fa-google"></i>
            </button>

        </div>


        <!-- Email -->
        <input
            type="text"
            placeholder="Email or Phone number"
        >


        <!-- Password -->
        <input
            type="password"
            placeholder="Please enter your password"
        >


        <!-- Sign In -->
        <button class="signin-btn" type="button">
            SIGN IN
        </button>


        <!-- Options -->
        <div class="login-options">

            <a href="#">
                Forgot password?
            </a>

            <label>
                <input type="checkbox">
                Remember me
            </label>

        </div>


        <!-- OR -->
        <div class="or">
            <span>or</span>
        </div>


        <!-- Sign Up -->
        <button
            class="signup-btn"
            type="button"
            onclick="goToDashboard()"
        >
            SIGN UP
        </button>

    </div>


    <!-- Footer -->
    <footer class="login-footer">

        <a href="#">Google Play Store APP</a>

        <a href="#">App Store APP</a>

        <a href="#">About MyPatientHUB</a>

        <a href="#">About Us</a>

        <a href="#">Our Blog</a>

    </footer>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>

</html>
